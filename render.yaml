services:
  - type: web
    name: flowdesk-pilot
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: SESSION_SECRET
        generateValue: true
      - key: DATA_DIR
        value: /var/data
    disk:
      name: flowdesk-data
      mountPath: /var/data
      sizeGB: 1
